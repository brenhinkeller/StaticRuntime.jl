name: CI
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - gc ${{ matrix.gc }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'pre' # the latest prerelease (1.14 has no release yet; change to '1.14' once it does)
        group:
          - Core
        # the collector as it is by default, and in stress mode (a collection every 3 allocations,
        # freed memory overwritten), which finds objects that the collector fails to see
        gc:
          - 'true'
          - '3'
        # Linux and macOS, on x86 and ARM (the compiled code is native, so the platforms differ)
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        # the architecture of each runner: an `include` entry with a key that is not an axis of the matrix is added to *every*
        # combination (and the last one wins), so it has to match one of the `os` values to be added only to those
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: ${{ matrix.group }}
          STATIC_RUNTIME_GC: ${{ matrix.gc }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v2
        with:
          files: lcov.info
  packages:
    # what compiles from the standard libraries and from other packages (Dates, SparseArrays, LinearAlgebra, Distributions.jl, StatsBase.jl, MPI.jl, ...), as programs that give what
    # Julia gives: a survey kept as tests (`test/packages`, the group `Packages`), which takes a few minutes, so it is a job of its own, on one platform of each kind
    name: Packages - ${{ matrix.os }}${{ matrix.experiment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install a debugger (a program that crashes is run again under it, and the log has where)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb
      - uses: julia-actions/julia-runtest@v1
        with:
          # (coverage instrumentation stops Julia from inlining and folding the code of the packages, which exposes calls that are not supported yet: a `getproperty` with a symbol that
          # is not a constant in Distributions; see the survey in the test of the package)
          coverage: false
        env:
          GROUP: Packages
          TEST_FOLDED: 1
          STATIC_RUNTIME_GC: ${{ matrix.gc || 'auto' }}
  fuzz:
    # random values and programs, each compiled and run in a process of its own with a time limit (`test/fuzz`, the group `Fuzzing`): the seeds that failed once, and random ones. A seed that fails
    # or does not finish is written with the command that runs it again by itself. It is a job of its own so that a case that takes long does not hold up the others (the core tests)
    name: Fuzzing - ${{ matrix.os }} - gc ${{ matrix.gc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        gc:
          - '3'
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          GROUP: Fuzzing
          STATIC_RUNTIME_GC: ${{ matrix.gc }}
          FUZZ_COUNT: 30
  cross-build:
    # programs for Linux made on macOS (`target = cross_target("aarch64-unknown-linux-gnu"; sysroot)`, see the manual: Cross-compiling), by Julia's own LLVM and the `lld` that Julia has, and linked with the glibc of the
    # platform; the programs are then run by the next job on a Linux machine of that architecture, and compared with what the same programs do when they are made natively (`test/cross`)
    name: Cross-compiling for Linux (aarch64), built on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - name: Fetch the C library of the target
        id: sysroot
        run: echo "dir=$(julia test/cross/sysroot.jl aarch64 | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Make the programs, and record what they do when they are made natively
        run: julia --project=. test/cross/build.jl aarch64-unknown-linux-gnu cross-out "${{ steps.sysroot.outputs.dir }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-linux-aarch64
          path: cross-out
  cross-run:
    name: Cross-compiled programs (aarch64), run on Linux
    needs: cross-build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'
          arch: aarch64
      - uses: actions/download-artifact@v4
        with:
          name: cross-linux-aarch64
          path: cross-out
      - name: The programs lose their permission to run in the artifact
        run: find cross-out -name exe -exec chmod +x {} +
      - name: Run them, and compare
        run: julia test/cross/check.jl cross-out
  cross-wasm:
    # programs for WebAssembly (wasm64: `target = "wasm64-unknown-unknown"`), made with Julia's LLVM and run with Node.js 24 (which has 64-bit memory), compared with what the same programs do natively (`test/cross`)
    name: Cross-compiling for WebAssembly, run with Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make the programs, and record what they do when they are made natively
        run: julia --project=. test/cross/build.jl wasm64-unknown-unknown cross-wasm
      - name: Run them with Node.js, and compare
        run: julia test/cross/check.jl cross-wasm
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # to deploy to the gh-pages branch with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre' 
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using StaticRuntime
            DocMeta.setdocmeta!(StaticRuntime, :DocTestSetup, :(using StaticRuntime); recursive=true)
            doctest(StaticRuntime)'
